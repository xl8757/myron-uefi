name: build-uefi
on:
  workflow_dispatch:
    inputs:
      display:
        description: "显示驱动：simple=SimpleFbDxe（用 ABL 留下的 framebuffer，默认）；custom=厂商 DisplayDxe（会初始化 MDSS）"
        type: choice
        options: [simple, custom]
        default: simple
      skip:
        description: "额外从 DXE.inc/APRIORI.inc 里剔除的模块名（空格分隔）"
        type: string
        default: ""
      vendor:
        description: "厂商 DXE 层：full=带上原厂那套（默认）；none=只留 Mu 自己的驱动，用来测 BDS/UniXNU 是否依赖它"
        type: choice
        options: [full, none]
        default: full
      keep:
        description: "vendor=none 时仍要保留的厂商模块名（空格分隔），例如只放回按键驱动"
        type: string
        default: ""
      label:
        description: "实验标签，会进 release 名，便于区分版本"
        type: string
        default: ""
      build_type:
        description: "构建类型（DEBUG 才会注入 SEC 屏幕日志）"
        type: choice
        options: [DEBUG, RELEASE]
        default: DEBUG
  push:
    paths:
      - 'Platforms/**'
      - 'Resources/**'
      - 'BootShim/**'
      - 'apply_screen_log.py'
      - 'tools/**'
      - 'validate_memory_map.py'
      - 'fetch_vendor_inputs.py'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  # 与本板型已验证的固件源码一致。上游默认分支会漂移，SEC 流程一变，
  # apply_screen_log.py 的锚点就对不上了。
  MU_COMMIT: 46e4ac0800862fb3ee6da09f0028fbef4e767648

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: validate myron memory map
        run: python3 validate_memory_map.py

      # apt 在这批 runner 上不可靠：DNS 时不时整段失效（"Temporary failure
      # resolving"），带重试的话能空耗二十分钟。ubuntu-24.04 镜像本来就带了
      # nasm/clang/lld/python，所以这里只限时试装一次，然后无条件打印工具
      # 清单——真缺什么，构建会立刻报出来，比在 apt 上空等强。
      - name: deps
        run: |
          APT="-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=8 -o Acquire::Retries=1"
          timeout 150 sudo apt-get $APT update -qq || echo "== apt update 失败，继续 =="
          timeout 180 sudo apt-get $APT install -y --no-install-recommends \
              uuid-dev nasm acpica-tools python3-venv python3-pip llvm \
              gcc-aarch64-linux-gnu libfuse3-dev || echo "== apt install 失败，继续 =="
          # BootShim 的 Makefile 调 llvm-objcopy。镜像里装着 LLVM 但它的 bin 目录
          # 不一定在 PATH 上，缺了就补个软链，别让整个构建挂在第 127 号错误上。
          if ! command -v llvm-objcopy >/dev/null 2>&1; then
            for c in /usr/lib/llvm-*/bin/llvm-objcopy /usr/bin/llvm-objcopy-*; do
              [ -x "$c" ] && sudo ln -sf "$c" /usr/local/bin/llvm-objcopy && break
            done
          fi
          if ! command -v llvm-objcopy >/dev/null 2>&1 && command -v aarch64-linux-gnu-objcopy >/dev/null 2>&1; then
            sudo ln -sf "$(command -v aarch64-linux-gnu-objcopy)" /usr/local/bin/llvm-objcopy
          fi
          echo "== 工具清单 =="
          for t in nasm iasl aarch64-linux-gnu-gcc clang ld.lld llvm-objcopy python3; do
            printf '%-24s ' "$t"; command -v "$t" || echo MISSING
          done
          ls -l /usr/include/uuid/uuid.h /usr/include/fuse3/fuse.h 2>/dev/null || true

      - name: clone Mu-Silicium (pinned)
        run: |
          git init -q Mu-Silicium
          git -C Mu-Silicium fetch --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git "$MU_COMMIT"
          git -C Mu-Silicium checkout -q FETCH_HEAD
          git -C Mu-Silicium submodule update --init --recursive --depth 1
          echo "mu at $(git -C Mu-Silicium rev-parse --short HEAD)"

      - name: venv and nasm shim
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p $D/Linux-x86-64
          echo 'version: 20016.1.1' > $D/extdep_state.yaml
          ln -sf /usr/bin/nasm /usr/bin/ndisasm $D/Linux-x86-64/ 2>/dev/null || true
          python3 -m venv venv
          venv/bin/pip install -r Mu-Silicium/pip-requirements.txt
          venv/bin/pip install uefi_firmware
          venv/bin/pip install capstone

      - name: vendor inputs
        run: |
          source venv/bin/activate
          python fetch_vendor_inputs.py --mu-root Mu-Silicium
          ls Mu-Silicium/Binaries/myron | wc -l

      # Xiaomi 的预编译 DXE 是 DEBUG 构建，断言里烧死了 CpuDeadLoop：一个返回
      # EFI_NOT_FOUND 的库构造函数就能把整机停死，而我们改 PcdDebugPropertyMask
      # 也管不到他们的镜像。把断言打印机里那两处调用（inertial delay 与
      # CpuDeadLoop）改成 nop，打印照旧、栈平衡不变，效果等同 RELEASE 构建。
      - name: neutralise vendor assert deadloops
        run: |
          source venv/bin/activate
          python tools/patch_vendor_asserts.py Mu-Silicium/Binaries/myron --require 200

      # myronPkg 的 DSC/FDF 引用了 UniXNUPkg 和 DarwinBootPkg。
      # UniXNU 的固件构建把 PACKAGES_PATH 设成 {tree}/package:{tree}/drivers/DarwinBoot，
      # 这里等价地把两个包放进了 Platforms/Xiaomi（它已经在 PackagesPath 里）。
      - name: unixnu packages
        run: |
          git clone --depth 1 https://github.com/xl8757/unixnu-myron-build.git unixnu
          git clone --depth 1 https://github.com/UniXNU/DarwinBoot.git darwinboot
          cp -r unixnu/package/UniXNUPkg Mu-Silicium/Platforms/Xiaomi/UniXNUPkg
          cp -r darwinboot/DarwinBootPkg Mu-Silicium/Platforms/Xiaomi/DarwinBootPkg
          # Official Advanced Logger (UniXNU Tools -> QR log export).
          # Common/Mu is mu_plus, pulled by the submodule update above; stage
          # the two packages under Platforms/Xiaomi, which is already in
          # PACKAGES_PATH, so the DSC/INF names resolve without touching Mu's
          # build driver.
          cp -r Mu-Silicium/Common/Mu/AdvLoggerPkg Mu-Silicium/Platforms/Xiaomi/AdvLoggerPkg
          cp -r Mu-Silicium/Common/Mu/MsGraphicsPkg Mu-Silicium/Platforms/Xiaomi/MsGraphicsPkg
          test -f Mu-Silicium/Platforms/Xiaomi/AdvLoggerPkg/AdvLoggerPkg.dec
          test -f Mu-Silicium/Platforms/Xiaomi/MsGraphicsPkg/Library/QrEncoderLib/QrEncoderLib.inf
          # 把 UniXNULib 对齐到官方主仓库。fork 停在 version 0.1.0，其 Main.c
          # 只在 Host == UniXNUHostFirmware 时才 UniXNUConnectAll ()；BDS 以普通
          # 应用启动菜单时不会连控制器，initrd 卷就拿不到 SimpleFileSystem，
          # 表现正是 'no boot entry found'（同机型真机记录也点名这一条）。
          # overlay 同时带来官方 AdvancedLogDxe（Tools -> 二维码日志导出）。
          cp -R overlay/UniXNUPkg/. Mu-Silicium/Platforms/Xiaomi/UniXNUPkg/
          test -f Mu-Silicium/Platforms/Xiaomi/UniXNUPkg/Driver/AdvancedLogDxe/AdvancedLogDxe.inf
          # 构建前断言：无条件 ConnectAll 确实进了构建树，避免 overlay 失效。
          grep -q '^  UniXNUConnectAll ();' \
            Mu-Silicium/Platforms/Xiaomi/UniXNUPkg/Library/UniXNULib/Main.c
          if grep -q 'if (Host == UniXNUHostFirmware)' \
            Mu-Silicium/Platforms/Xiaomi/UniXNUPkg/Library/UniXNULib/Main.c; then
            echo "Main.c 仍是条件式 ConnectAll"; exit 1
          fi
          echo "官方新版 UniXNULib 已就位（无条件 ConnectAll）"
          ls Mu-Silicium/Platforms/Xiaomi


      # build_uefi.py 只转发它自己 argument_map 里的键，页大小没法从 toml 传，
      # 所以直接在固定的 mkbootimg.py 上改默认值（与已知可启动的配方一致）。
      - name: pin boot image geometry
        run: python3 tools/patch_mkbootimg.py --mu-root Mu-Silicium

      - name: overlay myronPkg and BootShim
        run: |
          cp -r Platforms/Xiaomi/myronPkg Mu-Silicium/Platforms/Xiaomi/myronPkg
          cp Resources/Configs/myron.toml Mu-Silicium/Resources/Configs/myron.toml
          mkdir -p Mu-Silicium/Resources/DTBs
          cp Resources/DTBs/myron.dtb Mu-Silicium/Resources/DTBs/myron.dtb
          # BootShim.S：入口屏蔽 DAIF、跳转前同步 cache。
          # ScreenLog.c/ScreenFont.h：PlatformSecLib 通过相对路径包含它们。
          cp -r BootShim/. Mu-Silicium/BootShim/
          grep -q 'daifset' Mu-Silicium/BootShim/BootShim.S
          grep -q 'myron_screen_sec_entry' Mu-Silicium/BootShim/ScreenLog.c
          ls Mu-Silicium/BootShim
          sha256sum Mu-Silicium/Resources/DTBs/myron.dtb

      # 实验开关：不改仓库、只改构建产物，用于定位复位点。
      - name: apply experiment knobs
        env:
          DISPLAY_MODE: ${{ inputs.display || 'simple' }}
          SKIP_MODULES: ${{ inputs.skip || '' }}
          VENDOR_MODE: ${{ inputs.vendor || 'full' }}
          KEEP_MODULES: ${{ inputs.keep || '' }}
        run: |
          python3 tools/experiment.py \
            --pkg Mu-Silicium/Platforms/Xiaomi/myronPkg \
            --display "$DISPLAY_MODE" \
            --vendor "$VENDOR_MODE" \
            --keep $KEEP_MODULES \
            --skip $SKIP_MODULES

      - name: build uefi
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'DEBUG' }}
        run: |
          # FDF 在第一次构建就会引用稀疏卷，此时还没有 HelloPayload.efi；
          # 先放一个只含头部的占位，第二次构建前会被真实内容覆盖。
          python3 tools/make_payload.py sparse --placeholder \
            --out Mu-Silicium/Platforms/Xiaomi/myronPkg/Payload/payload-big.sparse
          cd Mu-Silicium
          source ../venv/bin/activate
          if [ "$BUILD_TYPE" = DEBUG ]; then
            python3 ../apply_screen_log.py --mu-root .
          fi
          python3 build_uefi.py -d myron -r "$BUILD_TYPE"
          echo "=== 产物 ==="
          # boot.img 由 build_uefi.py 写在 Mu-Silicium/ 根目录，固件卷在 Build/ 下。
          ls -l Mu-myron*.img BootShim/BootShim.bin
          fd=$(ls Build/myronPkg/*/FV/SILICIUM_UEFI.fd)
          # shim 的拷贝循环按 FD_SIZE 逐字节搬，体积不对必然搬进垃圾。
          test "$(stat -c %s "$fd")" -eq $((0x300000)) || { echo "FD 不是 0x300000 字节"; exit 1; }
          sha256sum "$fd"
          img=$(ls Mu-myron*.img | head -1)
          # 校验 shim 里确实带上了本次的两处修正（DAIF 屏蔽、跳转前 cache 同步），
          # 并核对 boot.img 的头部参数与解压后的载荷。
          python3 ../tools/check_artifacts.py --shim BootShim/BootShim.bin --img "$img" --fd "$fd"
          sha256sum "$img" BootShim/BootShim.bin
          cp "$img" BootShim/../myron-boot.img

      # 菜单读的是某个文件系统卷里的 /EFI/UniXNU/unixnu.toml。内存启动时
      # 装载器把内存盘放哪儿不由我们决定（实测 /chosen 指到未映射的地址），
      # 所以把卷放进固件卷：驱动用 GetSectionFromAnyFv 取，完全可控。
      # HelloPayload 由上面那次构建产出，因此这里补第二遍（增量，只重跑 GenFv）。
      - name: payload volume with the hello entry
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'DEBUG' }}
        run: |
          efi=$(find Mu-Silicium/Build -name HelloPayload.efi -print -quit)
          test -n "$efi" || { echo "没找到 HelloPayload.efi"; exit 1; }
          ls -l "$efi"
          python3 tools/make_payload.py fat --out Mu-Silicium/Platforms/Xiaomi/myronPkg/Payload/payload.img \
            --size-kib 1024 \
            --add "EFI/UNIXNU/UNIXNU.TOM=Resources/payload/unixnu.toml" \
            --add "PAYLOADS/HELLO.EFI=$efi"
          # 48 MiB 大卷走 XNU_Payload 预留区（0xF0000000）。FAT12 每簇 32 扇区
          # 才能把簇数压在 4084 以内；小卷仍留在 FD 里作兜底，大卷地址由
          # repack 写进 boot.img 头。配置刻意不同（title / args=pause），日志
          # 里的 runtime unixnu.toml 能直接证明设备用的是哪一个。
          python3 tools/make_payload.py fat --out Mu-Silicium/Platforms/Xiaomi/myronPkg/Payload/payload-big.img \
            --size-kib 49152 --cluster-sectors 32 \
            --add "EFI/UNIXNU/UNIXNU.TOM=Resources/payload/unixnu-big.toml" \
            --add "PAYLOADS/HELLO.EFI=$efi"
          python3 tools/make_payload.py sparse \
            --in Mu-Silicium/Platforms/Xiaomi/myronPkg/Payload/payload-big.img \
            --out Mu-Silicium/Platforms/Xiaomi/myronPkg/Payload/payload-big.sparse
          cd Mu-Silicium
          source ../venv/bin/activate
          python3 build_uefi.py -d myron -r "$BUILD_TYPE"
          cd ..
          # 第二次构建只增量重跑 GenFv：Build/ 下的 FD 更新了，但
          # myron-boot.img 仍是第一次构建时内嵌的旧 FD。实测后果是设备读到
          # 旧 unixnu.toml（timeout=30、相对路径），payload 卷的改动永远到
          # 不了机器。把新 FD 换进 gzip(BootShim + FD) 并强制比对。
          fd=$(ls Mu-Silicium/Build/myronPkg/*/FV/SILICIUM_UEFI.fd)
          python3 tools/make_payload.py refd --boot Mu-Silicium/myron-boot.img \
            --fd "$fd" --out Mu-Silicium/myron-boot.img
          ls -l Mu-Silicium/myron-boot.img
          python3 tools/check_artifacts.py --shim Mu-Silicium/BootShim/BootShim.bin \
            --img Mu-Silicium/myron-boot.img --fd "$fd"

      # boot ramdisk 已被设备日志证伪：ABL 在 fastboot boot 时只搬 kernel 段
      # （x0=0、无 DTB），48 MiB ramdisk 从没被用过。大卷改由 FD 内的稀疏
      # 副本在 DXE 阶段还原，所以这里不再 repack，boot.img 保持构建产物原样。

      - uses: actions/upload-artifact@v4
        with:
          name: uefi-myron
          path: |
            Mu-Silicium/Build/**/FV/*.fd
            Mu-Silicium/BootShim/BootShim.bin
            Mu-Silicium/myron-boot.img
          if-no-files-found: error
          retention-days: 14

      # 固件卷和 boot.img 挂到公开 release：不用登录、不用 token 就能下载。
      - name: publish firmware volume
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          label="${{ inputs.label }}"
          mode="${{ inputs.display || 'simple' }}"
          tag="fd-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}${label:+-$label}"
          fd=$(ls Mu-Silicium/Build/myronPkg/*/FV/SILICIUM_UEFI.fd)
          notes=$(printf 'display=%s\nbuild=%s\nskip=%s\nsha256=%s\nsource=%s\nmu=%s' \
            "$mode" "${{ inputs.build_type || 'DEBUG' }}" "${{ inputs.skip }}" \
            "$(sha256sum "$fd" | cut -d' ' -f1)" "${GITHUB_SHA}" "$MU_COMMIT")
          assets=("$fd")
          [ -f Mu-Silicium/myron-boot.img ] && assets+=("Mu-Silicium/myron-boot.img")
          [ -f Mu-Silicium/BootShim/BootShim.bin ] && assets+=("Mu-Silicium/BootShim/BootShim.bin")
          ls -l "${assets[@]}"
          gh release create "$tag" --title "$tag" --notes "$notes" "${assets[@]}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
