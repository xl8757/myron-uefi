name: build-uefi
on:
  workflow_dispatch:
    inputs:
      display:
        description: "显示驱动：simple=SimpleFbDxe（用 ABL 留下的 framebuffer，默认）；custom=厂商 DisplayDxe（会初始化 MDSS）"
        type: choice
        options: [simple, custom]
        default: simple
      skip:
        description: "额外从 DXE.inc/APRIORI.inc 里剔除的模块名（空格分隔）"
        type: string
        default: ""
      label:
        description: "实验标签，会进 release 名，便于区分版本"
        type: string
        default: ""
      build_type:
        description: "构建类型（DEBUG 才会注入 SEC 屏幕日志）"
        type: choice
        options: [DEBUG, RELEASE]
        default: DEBUG
  push:
    paths:
      - 'Platforms/**'
      - 'Resources/**'
      - 'BootShim/**'
      - 'apply_screen_log.py'
      - 'validate_memory_map.py'
      - 'fetch_vendor_inputs.py'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  # 与本板型已验证的固件源码一致。上游默认分支会漂移，SEC 流程一变，
  # apply_screen_log.py 的锚点就对不上了。
  MU_COMMIT: 46e4ac0800862fb3ee6da09f0028fbef4e767648

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: validate myron memory map
        run: python3 validate_memory_map.py

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential uuid-dev nasm acpica-tools python3 python3-venv python3-pip clang lld llvm gcc-aarch64-linux-gnu libfuse3-dev

      - name: clone Mu-Silicium (pinned)
        run: |
          git init -q Mu-Silicium
          git -C Mu-Silicium fetch --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git "$MU_COMMIT"
          git -C Mu-Silicium checkout -q FETCH_HEAD
          git -C Mu-Silicium submodule update --init --recursive --depth 1
          echo "mu at $(git -C Mu-Silicium rev-parse --short HEAD)"

      - name: venv and nasm shim
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p $D/Linux-x86-64
          echo 'version: 20016.1.1' > $D/extdep_state.yaml
          ln -sf /usr/bin/nasm /usr/bin/ndisasm $D/Linux-x86-64/ 2>/dev/null || true
          python3 -m venv venv
          venv/bin/pip install -r Mu-Silicium/pip-requirements.txt
          venv/bin/pip install uefi_firmware

      - name: vendor inputs
        run: |
          source venv/bin/activate
          python fetch_vendor_inputs.py --mu-root Mu-Silicium
          ls Mu-Silicium/Binaries/myron | wc -l

      # myronPkg 的 DSC/FDF 引用了 UniXNUPkg 和 DarwinBootPkg。
      # UniXNU 的固件构建把 PACKAGES_PATH 设成 {tree}/package:{tree}/drivers/DarwinBoot，
      # 这里等价地把两个包放进了 Platforms/Xiaomi（它已经在 PackagesPath 里）。
      - name: unixnu packages
        run: |
          git clone --depth 1 https://github.com/xl8757/unixnu-myron-build.git unixnu
          git clone --depth 1 https://github.com/UniXNU/DarwinBoot.git darwinboot
          cp -r unixnu/package/UniXNUPkg Mu-Silicium/Platforms/Xiaomi/UniXNUPkg
          cp -r darwinboot/DarwinBootPkg Mu-Silicium/Platforms/Xiaomi/DarwinBootPkg
          ls Mu-Silicium/Platforms/Xiaomi

      - name: overlay myronPkg and BootShim
        run: |
          cp -r Platforms/Xiaomi/myronPkg Mu-Silicium/Platforms/Xiaomi/myronPkg
          cp Resources/Configs/myron.toml Mu-Silicium/Resources/Configs/myron.toml
          mkdir -p Mu-Silicium/Resources/DTBs
          cp Resources/DTBs/myron.dtb Mu-Silicium/Resources/DTBs/myron.dtb
          # BootShim.S：入口屏蔽 DAIF、跳转前同步 cache。
          # ScreenLog.c/ScreenFont.h：PlatformSecLib 通过相对路径包含它们。
          cp -r BootShim/. Mu-Silicium/BootShim/
          grep -q 'daifset' Mu-Silicium/BootShim/BootShim.S
          grep -q 'myron_screen_sec_entry' Mu-Silicium/BootShim/ScreenLog.c
          ls Mu-Silicium/BootShim
          sha256sum Mu-Silicium/Resources/DTBs/myron.dtb

      # 实验开关：不改仓库、只改构建产物，用于定位复位点。
      - name: apply experiment knobs
        env:
          DISPLAY_MODE: ${{ inputs.display || 'simple' }}
          SKIP_MODULES: ${{ inputs.skip || '' }}
        run: |
          python3 tools/experiment.py \
            --pkg Mu-Silicium/Platforms/Xiaomi/myronPkg \
            --display "$DISPLAY_MODE" \
            --skip $SKIP_MODULES

      - name: build uefi
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'DEBUG' }}
        run: |
          cd Mu-Silicium
          source ../venv/bin/activate
          if [ "$BUILD_TYPE" = DEBUG ]; then
            python3 ../apply_screen_log.py --mu-root .
          fi
          python3 build_uefi.py -d myron -r "$BUILD_TYPE"
          echo "=== 产物 ==="
          find Build/myronPkg -maxdepth 4 -type f \( -name '*.fd' -o -name '*.img' \) -exec ls -l {} \;
          fd=$(ls Build/myronPkg/*/FV/SILICIUM_UEFI.fd)
          size=$(stat -c %s "$fd")
          echo "FD size = $size"
          # shim 的拷贝循环按 FD_SIZE 逐字节搬，体积不对必然搬进垃圾。
          test "$size" -eq $((0x300000)) || { echo "FD 不是 0x300000 字节"; exit 1; }
          sha256sum "$fd"
          for img in Build/myronPkg/*/FV/*.img; do [ -f "$img" ] && sha256sum "$img"; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: uefi-myron
          path: |
            Mu-Silicium/Build/**/FV/*.fd
            Mu-Silicium/Build/**/FV/*.img
          if-no-files-found: error
          retention-days: 14

      # 固件卷和 boot.img 挂到公开 release：不用登录、不用 token 就能下载。
      - name: publish firmware volume
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          label="${{ inputs.label }}"
          mode="${{ inputs.display || 'simple' }}"
          tag="fd-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}${label:+-$label}"
          fd=$(ls Mu-Silicium/Build/myronPkg/*/FV/SILICIUM_UEFI.fd)
          notes=$(printf 'display=%s\nbuild=%s\nskip=%s\nsha256=%s\nsource=%s\nmu=%s' \
            "$mode" "${{ inputs.build_type || 'DEBUG' }}" "${{ inputs.skip }}" \
            "$(sha256sum "$fd" | cut -d' ' -f1)" "${GITHUB_SHA}" "$MU_COMMIT")
          assets=("$fd")
          for img in Mu-Silicium/Build/myronPkg/*/FV/*.img; do [ -f "$img" ] && assets+=("$img"); done
          ls -l "${assets[@]}"
          gh release create "$tag" --title "$tag" --notes "$notes" "${assets[@]}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
