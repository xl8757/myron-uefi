#
# Device Status
#
[status]
model_count = 2

#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0xA7100000
size = 0x800000   # 8 MiB: the vendor UFS chain (UFSDxe 176 KiB, ClockDxe 270 KiB,
                  # ChipInfo/DDRInfo/Smem + their depex providers) does not fit in the
                  # original 3 MiB. 0xA7100000 + 8 MiB = 0xA7900000, still below the
                  # kernel's 0xA8000000 load address.

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
[boot_image]
# K90 Pro Max class ABL: with header v4 it loads init_boot's generic ramdisk instead of
# the payload in this image, so the UniXNU payload needs header v0.
header_version = 0
os_version = "16.0.0"
os_patch_level = "2026-06"
